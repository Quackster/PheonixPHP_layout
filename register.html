<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Retro — Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="reg">
<div class="container">
    <div class="header">
        <canvas class="wordmark" id="wordmark" width="72" height="40"></canvas>
        <div class="online t"><b>0</b> Online</div>
    </div>

    <img class="scene wide" src="img/hero_cn.png" width="721" height="431" alt="">

    <div class="panel avatarbox">
        <h2>Avatar</h2>
        <img class="fig-male" src="img/avatar_male.png" width="36" height="88" alt="">
        <img class="fig-female" src="img/avatar_female.png" width="51" height="88" alt="">
        <label class="t lbl-male" for="sex-male">Male:</label>
        <input class="radio rdo-male" type="radio" name="sex" id="sex-male" value="male" checked>
        <label class="t lbl-female" for="sex-female">Female:</label>
        <input class="radio rdo-female" type="radio" name="sex" id="sex-female" value="female">
    </div>

    <div class="panel regbox">
        <h2>Register</h2>
        <div class="t lb1">Username:</div>
        <input class="textinput in1" type="text" placeholder="Username">
        <div class="t lb2">Email:</div>
        <input class="textinput in2" type="text" placeholder="Email Address">
        <div class="t lb3">Password:</div>
        <input class="textinput in3" type="password" placeholder="Password">
        <div class="t lb4">Confirm Password:</div>
        <input class="textinput in4" type="password" placeholder="Confirm Password">
        <div class="t agree">By clicking Submit, I agree to the<br><a href="terms.html">Terms of Service.</a></div>
        <button class="btn" type="button">Submit</button>
    </div>

    <div class="footerlinks">
        <a href="index.html">Homepage</a><span class="sep">|</span><a href="terms.html">Terms of Service</a><span class="sep">|</span><a href="terms.html">Privacy Policy</a>
    </div>
</div>
<script src="js/logo_front.js"></script>
<script src="js/main.js"></script>
</body>
</html>
